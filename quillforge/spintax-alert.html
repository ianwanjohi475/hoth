<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quillforge — Spintax Error Detected</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #0B0E14;
      --surface: #161B25;
      --border:  #2E374A;
      --text:    #E8EDF5;
      --muted:   #9BA8BD;
      --accent:  #4F8BFF;
      --danger:  #F25B7A;
      --warning: #F2B547;
    }
    html, body { height: 100%; }
    body {
      font-family: "Inter", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at top, #2A0E18 0%, #0B0E14 70%);
      overflow: hidden;
      position: relative;
      animation: bg-pulse 1.4s ease-in-out infinite alternate;
    }
    @keyframes bg-pulse {
      from { background: radial-gradient(ellipse at top, #2A0E18 0%, #0B0E14 70%); }
      to   { background: radial-gradient(ellipse at top, #4A1228 0%, #160817 70%); }
    }

    /* Subtle scanline overlay */
    body::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(242,91,122,0.10), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(242,181,71,0.08),  transparent 50%);
      pointer-events: none;
    }

    .panel {
      position: relative; z-index: 1;
      width: 100%; max-width: 560px;
      margin: 24px;
      background: rgba(22,27,37,0.85);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 44px 36px;
      box-shadow:
        0 24px 64px rgba(0,0,0,0.6),
        0 0 0 1px rgba(242,91,122,0.20),
        0 0 60px rgba(242,91,122,0.22);
      backdrop-filter: blur(12px);
      animation: panel-pulse 1.4s ease-in-out infinite alternate;
    }
    @keyframes panel-pulse {
      from { box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(242,91,122,0.20), 0 0 60px rgba(242,91,122,0.20); }
      to   { box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(242,91,122,0.55), 0 0 100px rgba(242,91,122,0.45); }
    }

    .panel-header {
      display: flex; align-items: center; gap: 14px; margin-bottom: 28px;
    }
    .panel-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, #F25B7A, #B22D52);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(242,91,122,0.5);
      flex-shrink: 0;
    }
    .panel-icon svg { width: 26px; height: 26px; }
    .panel-eyebrow {
      font-size: 11px; font-weight: 700;
      color: var(--danger); letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .panel-title {
      font-size: 28px; font-weight: 700;
      letter-spacing: -0.02em; margin-top: 4px;
    }

    .panel-desc {
      font-size: 15px; color: var(--muted);
      line-height: 1.55; margin-bottom: 28px;
    }

    .timer-card {
      background: var(--bg-deep);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .timer-label {
      font-size: 11px; font-weight: 600;
      color: var(--muted); letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .timer-value {
      font-family: "JetBrains Mono","SF Mono",Menlo,monospace;
      font-size: 38px; font-weight: 600;
      color: var(--danger);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-top: 4px;
    }
    .timer-pulse {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--danger); flex-shrink: 0;
      animation: dot-pulse 0.8s ease-in-out infinite;
    }
    @keyframes dot-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.35); opacity: 0.6; }
    }

    .stop-btn {
      width: 100%;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 24px;
      background: var(--danger); color: #fff;
      border: none; border-radius: 12px;
      font-family: inherit;
      font-size: 14px; font-weight: 600; letter-spacing: -0.005em;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(242,91,122,0.4);
      transition: transform 150ms cubic-bezier(.2,.8,.2,1), box-shadow 150ms;
    }
    .stop-btn svg { width: 16px; height: 16px; }
    .stop-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(242,91,122,0.55); }
    .stop-btn:active { transform: translateY(0); }
    .stop-btn.is-stopped {
      background: var(--surface);
      color: var(--muted);
      box-shadow: none;
      cursor: default;
    }

    .panel-foot {
      margin-top: 22px;
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--muted);
      letter-spacing: 0.04em;
    }
    .panel-foot .tag {
      font-family: "JetBrains Mono","SF Mono",Menlo,monospace;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <audio id="alarm" src="beep.wav" autoplay loop></audio>

  <div class="panel" id="panel">
    <div class="panel-header">
      <div class="panel-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <div>
        <div class="panel-eyebrow">Quillforge · Critical Alert</div>
        <div class="panel-title">Spintax error detected</div>
      </div>
    </div>

    <div class="panel-desc">
      The article tab has been closed automatically. Review the assignment before resubmitting — the client requested spintax variation in the deliverable.
    </div>

    <div class="timer-card">
      <div>
        <div class="timer-label">Alarm time remaining</div>
        <div class="timer-value" id="countdown">30:00</div>
      </div>
      <div class="timer-pulse" id="timerDot" aria-hidden="true"></div>
    </div>

    <button class="stop-btn" id="stopBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="22" y1="9" x2="16" y2="15"/>
        <line x1="16" y1="9" x2="22" y2="15"/>
      </svg>
      <span>Stop alarm</span>
    </button>

    <div class="panel-foot">
      <span>Detected <span id="timestamp" class="tag">—</span></span>
      <span class="tag">QUILLFORGE</span>
    </div>
  </div>

  <script>
    const TOTAL = 30 * 60;
    let remaining = TOTAL;
    let ticker    = null;
    let stopped   = false;

    const alarm       = document.getElementById('alarm');
    const countdownEl = document.getElementById('countdown');
    const timestampEl = document.getElementById('timestamp');
    const stopBtn     = document.getElementById('stopBtn');
    const panel       = document.getElementById('panel');
    const timerDot    = document.getElementById('timerDot');

    const fmt = s => String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
    timestampEl.textContent = new Date().toLocaleTimeString();

    function stopAlarm() {
      if (stopped) return;
      stopped = true;
      alarm.pause();
      alarm.currentTime = 0;
      clearInterval(ticker);
      countdownEl.textContent = '00:00';
      document.body.style.animation = 'none';
      document.body.style.background = '#0B0E14';
      panel.style.animation = 'none';
      timerDot.style.animation = 'none';
      stopBtn.classList.add('is-stopped');
      stopBtn.querySelector('span').textContent = 'Alarm stopped';
      stopBtn.disabled = true;
    }

    ticker = setInterval(() => {
      remaining--;
      countdownEl.textContent = fmt(Math.max(remaining, 0));
      if (remaining <= 0) stopAlarm();
    }, 1000);

    stopBtn.addEventListener('click', () => {
      stopAlarm();
      try { chrome.runtime.sendMessage({ type: 'STOP_ALARM' }); } catch (_) {}
    });

    window.addEventListener('beforeunload', stopAlarm);
  </script>
</body>
</html>
